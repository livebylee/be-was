<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="../reset.css" rel="stylesheet"/>
    <link href="../global.css" rel="stylesheet"/>
    <title>로그인 실패</title>
</head>
<body>
<div class="container">
    <header class="header">
        <a href="/"><img src="../img/signiture.svg"/></a>
        <ul class="header__menu">
            <li class="header__menu__item">
                <a class="btn btn_contained btn_size_s" href="/login">로그인</a>
            </li>
            <li class="header__menu__item">
                <a class="btn btn_ghost btn_size_s" href="/registration">
                    회원 가입
                </a>
            </li>
        </ul>
    </header>
    <div class="page">
        <h2 class="page-title" style="color: #e74c3c;">로그인에 실패했습니다</h2>

        <div class="form" style="text-align: center;">
            <p style="margin-bottom: 32px; line-height: 1.6; color: #555;">
                아이디 또는 비밀번호가 일치하지 않습니다.<br>
                다시 한번 확인해 주세요.
            </p>

            <a href="/login" class="btn btn_contained btn_size_m" style="display: block; text-decoration: none;">
                다시 로그인하기
            </a>

            <a href="/" style="display: block; margin-top: 16px; color: #999; font-size: 14px; text-decoration: underline;">
                메인 페이지로 이동
            </a>
        </div>
    </div>
</div>
</body>
</html>
