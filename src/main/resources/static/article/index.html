<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../reset.css" rel="stylesheet" />
    <link href="../global.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a href="/main"><img src="../img/signiture.svg" /></a>
        <ul class="header__menu">
          <li class="header__menu__item">
            <a class="btn btn_contained btn_size_s" href="/article">글쓰기</a>
          </li>
          <li class="header__menu__item">
            <button id="logout-btn" class="btn btn_ghost btn_size_s">
              로그아웃
            </button>
          </li>
        </ul>
      </header>
      <div class="page">
        <h2 class="page-title">게시글 작성</h2>
        <form class="form" action ="/article/new" method="POST" enctype="multipart/form-data">
          <div class="textfield textfield_size_m">
            <p class="title_textfield">내용</p>
            <textarea
                name="content"
                class="input_textfield"
                placeholder="글의 내용을 입력하세요"
                required
            ></textarea>
          </div>

          <div class="textfield textfield_size_m" style="margin-top: 16px;">
            <p class="title_textfield">이미지 첨부</p>
            <input
                    type="file"
                    name="image"
                    accept="image/*"
                    class="input_textfield"
                    style="padding: 8px;"
            />
          </div>
          <button
            id="registration-btn"
            class="btn btn_contained btn_size_m"
            style="margin-top: 24px"
            type="submit"
          >
            작성 완료
          </button>
        </form>
      </div>
    </div>
    <script>
      // 페이지 로드 시 실행
      window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');

        if (error === 'missing_image') {
          alert('이미지를 업로드해야 게시글을 작성할 수 있습니다.');
        }
        // 2. 글자 수 초과 알림 (Controller에서 처리할 경우)
        else if (error === 'length_exceeded') {
          alert('내용이 너무 깁니다. (최대 10,000자)');
        }

        const showAllBtn = document.getElementById('show-all-btn');
        if (showAllBtn) {
          showAllBtn.addEventListener('click', function() {
            const hiddenComments = document.querySelectorAll('.comment__item.hidden');
            hiddenComments.forEach(comment => comment.classList.remove('hidden'));
            this.style.display = 'none';
          });
        }
      };
    </script>
  </body>
</html>
